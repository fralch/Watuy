<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cielo -->
  <rect width="1920" height="600" fill="url(#skyGradient)"/>
  
  <!-- Tierra/Suelo -->
  <rect y="600" width="1920" height="480" fill="url(#groundGradient)"/>
  
  <!-- Montañas de fondo -->
  <polygon points="0,500 300,200 600,400 900,150 1200,300 1500,100 1800,250 1920,200 1920,600 0,600" fill="#696969" opacity="0.7"/>
  
  <!-- Excavadora principal -->
  <g transform="translate(400,450)">
    <!-- Cuerpo principal -->
    <rect x="0" y="50" width="200" height="80" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <!-- Cabina -->
    <rect x="150" y="20" width="80" height="60" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <!-- Ventanas -->
    <rect x="160" y="30" width="25" height="20" fill="#87CEEB" opacity="0.8"/>
    <rect x="190" y="30" width="25" height="20" fill="#87CEEB" opacity="0.8"/>
    <!-- Brazo -->
    <rect x="50" y="30" width="80" height="15" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <!-- Pala -->
    <polygon points="20,20 50,30 50,45 15,50" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <!-- Orugas -->
    <ellipse cx="50" cy="140" rx="40" ry="15" fill="#2F4F4F"/>
    <ellipse cx="150" cy="140" rx="40" ry="15" fill="#2F4F4F"/>
  </g>
  
  <!-- Grúa -->
  <g transform="translate(800,300)">
    <!-- Base -->
    <rect x="0" y="200" width="60" height="100" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
    <!-- Torre -->
    <rect x="25" y="50" width="10" height="200" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
    <!-- Brazo horizontal -->
    <rect x="35" y="55" width="150" height="8" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
    <!-- Contrapeso -->
    <rect x="0" y="55" width="35" height="15" fill="#8B0000"/>
    <!-- Cable -->
    <line x1="170" y1="63" x2="170" y2="150" stroke="#2F4F4F" stroke-width="2"/>
    <!-- Gancho -->
    <circle cx="170" cy="155" r="5" fill="#FFD700"/>
  </g>
  
  <!-- Bulldozer -->
  <g transform="translate(1200,480)">
    <!-- Cuerpo -->
    <rect x="0" y="40" width="180" height="70" fill="#32CD32" stroke="#228B22" stroke-width="2"/>
    <!-- Cabina -->
    <rect x="120" y="15" width="60" height="50" fill="#32CD32" stroke="#228B22" stroke-width="2"/>
    <!-- Ventana -->
    <rect x="130" y="25" width="40" height="20" fill="#87CEEB" opacity="0.8"/>
    <!-- Pala frontal -->
    <rect x="180" y="20" width="15" height="60" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <!-- Orugas -->
    <ellipse cx="40" cy="120" rx="35" ry="12" fill="#2F4F4F"/>
    <ellipse cx="140" cy="120" rx="35" ry="12" fill="#2F4F4F"/>
  </g>
  
  <!-- Camión volquete -->
  <g transform="translate(100,520)">
    <!-- Chasis -->
    <rect x="0" y="40" width="200" height="40" fill="#FF4500" stroke="#DC143C" stroke-width="2"/>
    <!-- Cabina -->
    <rect x="0" y="10" width="60" height="40" fill="#FF4500" stroke="#DC143C" stroke-width="2"/>
    <!-- Ventana -->
    <rect x="10" y="20" width="40" height="20" fill="#87CEEB" opacity="0.8"/>
    <!-- Tolva -->
    <polygon points="70,10 200,10 190,40 70,40" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <!-- Ruedas -->
    <circle cx="30" cy="90" r="15" fill="#2F4F4F"/>
    <circle cx="170" cy="90" r="15" fill="#2F4F4F"/>
    <circle cx="140" cy="90" r="15" fill="#2F4F4F"/>
  </g>
  
  <!-- Nubes -->
  <ellipse cx="300" cy="150" rx="60" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="320" cy="140" rx="40" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="280" cy="140" rx="35" ry="20" fill="white" opacity="0.8"/>
  
  <ellipse cx="800" cy="100" rx="80" ry="40" fill="white" opacity="0.8"/>
  <ellipse cx="830" cy="90" rx="50" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="770" cy="90" rx="45" ry="25" fill="white" opacity="0.8"/>
  
  <ellipse cx="1400" cy="120" rx="70" ry="35" fill="white" opacity="0.8"/>
  <ellipse cx="1430" cy="110" rx="45" ry="28" fill="white" opacity="0.8"/>
  <ellipse cx="1370" cy="110" rx="40" ry="22" fill="white" opacity="0.8"/>
  
  <!-- Sol -->
  <circle cx="1700" cy="200" r="80" fill="#FFD700" opacity="0.9"/>
  <g transform="translate(1700,200)">
    <line x1="-120" y1="0" x2="-100" y2="0" stroke="#FFD700" stroke-width="4"/>
    <line x1="100" y1="0" x2="120" y2="0" stroke="#FFD700" stroke-width="4"/>
    <line x1="0" y1="-120" x2="0" y2="-100" stroke="#FFD700" stroke-width="4"/>
    <line x1="0" y1="100" x2="0" y2="120" stroke="#FFD700" stroke-width="4"/>
    <line x1="-85" y1="-85" x2="-71" y2="-71" stroke="#FFD700" stroke-width="4"/>
    <line x1="71" y1="71" x2="85" y2="85" stroke="#FFD700" stroke-width="4"/>
    <line x1="85" y1="-85" x2="71" y2="-71" stroke="#FFD700" stroke-width="4"/>
    <line x1="-71" y1="71" x2="-85" y2="85" stroke="#FFD700" stroke-width="4"/>
  </g>
</svg>