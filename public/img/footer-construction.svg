<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkSkyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Cielo nocturno -->
  <rect width="1920" height="400" fill="url(#darkSkyGradient)"/>
  
  <!-- Suelo -->
  <rect y="400" width="1920" height="200" fill="url(#darkGroundGradient)"/>
  
  <!-- Siluetas de montañas -->
  <polygon points="0,350 200,200 400,280 600,150 800,220 1000,100 1200,180 1400,120 1600,200 1800,160 1920,180 1920,400 0,400" fill="#1A252F" opacity="0.8"/>
  
  <!-- Luces de construcción -->
  <circle cx="300" cy="250" r="100" fill="url(#lightGlow)"/>
  <circle cx="800" cy="200" r="120" fill="url(#lightGlow)"/>
  <circle cx="1400" cy="280" r="90" fill="url(#lightGlow)"/>
  
  <!-- Excavadora silueta -->
  <g transform="translate(250,350)" opacity="0.6">
    <rect x="0" y="50" width="180" height="70" fill="#1A252F"/>
    <rect x="130" y="25" width="70" height="55" fill="#1A252F"/>
    <rect x="45" y="35" width="70" height="12" fill="#1A252F"/>
    <polygon points="15,25 45,35 45,47 10,52" fill="#1A252F"/>
    <ellipse cx="45" cy="130" rx="35" ry="12" fill="#0F1419"/>
    <ellipse cx="135" cy="130" rx="35" ry="12" fill="#0F1419"/>
    <!-- Luces de la máquina -->
    <circle cx="140" cy="40" r="3" fill="#F39C12" opacity="0.8"/>
    <circle cx="155" cy="40" r="3" fill="#F39C12" opacity="0.8"/>
  </g>
  
  <!-- Grúa silueta -->
  <g transform="translate(750,200)" opacity="0.7">
    <rect x="0" y="150" width="50" height="80" fill="#1A252F"/>
    <rect x="20" y="40" width="8" height="150" fill="#1A252F"/>
    <rect x="28" y="45" width="120" height="6" fill="#1A252F"/>
    <rect x="0" y="45" width="28" height="12" fill="#1A252F"/>
    <line x1="140" y1="48" x2="140" y2="120" stroke="#1A252F" stroke-width="2"/>
    <circle cx="140" cy="125" r="4" fill="#1A252F"/>
    <!-- Luz de advertencia -->
    <circle cx="25" cy="35" r="2" fill="#E74C3C" opacity="0.9"/>
  </g>
  
  <!-- Bulldozer silueta -->
  <g transform="translate(1300,380)" opacity="0.6">
    <rect x="0" y="35" width="160" height="60" fill="#1A252F"/>
    <rect x="110" y="15" width="50" height="45" fill="#1A252F"/>
    <rect x="160" y="20" width="12" height="50" fill="#1A252F"/>
    <ellipse cx="35" cy="105" rx="30" ry="10" fill="#0F1419"/>
    <ellipse cx="125" cy="105" rx="30" ry="10" fill="#0F1419"/>
    <!-- Luces -->
    <circle cx="120" cy="30" r="2" fill="#F39C12" opacity="0.8"/>
    <circle cx="140" cy="30" r="2" fill="#F39C12" opacity="0.8"/>
  </g>
  
  <!-- Camión volquete silueta -->
  <g transform="translate(50,420)" opacity="0.5">
    <rect x="0" y="35" width="170" height="35" fill="#1A252F"/>
    <rect x="0" y="15" width="50" height="35" fill="#1A252F"/>
    <polygon points="60,15 170,15 160,35 60,35" fill="#1A252F"/>
    <circle cx="25" cy="80" r="12" fill="#0F1419"/>
    <circle cx="145" cy="80" r="12" fill="#0F1419"/>
    <circle cx="120" cy="80" r="12" fill="#0F1419"/>
    <!-- Luces delanteras -->
    <circle cx="10" cy="25" r="2" fill="#F39C12" opacity="0.7"/>
    <circle cx="10" cy="35" r="2" fill="#F39C12" opacity="0.7"/>
  </g>
  
  <!-- Estrellas -->
  <circle cx="150" cy="80" r="1" fill="white" opacity="0.8"/>
  <circle cx="300" cy="60" r="1" fill="white" opacity="0.6"/>
  <circle cx="500" cy="90" r="1" fill="white" opacity="0.9"/>
  <circle cx="700" cy="50" r="1" fill="white" opacity="0.7"/>
  <circle cx="900" cy="70" r="1" fill="white" opacity="0.8"/>
  <circle cx="1100" cy="40" r="1" fill="white" opacity="0.6"/>
  <circle cx="1300" cy="85" r="1" fill="white" opacity="0.9"/>
  <circle cx="1500" cy="55" r="1" fill="white" opacity="0.7"/>
  <circle cx="1700" cy="75" r="1" fill="white" opacity="0.8"/>
  <circle cx="1850" cy="45" r="1" fill="white" opacity="0.6"/>
  
  <!-- Luna -->
  <circle cx="1650" cy="120" r="40" fill="#F4F4F4" opacity="0.9"/>
  <circle cx="1640" cy="110" r="3" fill="#E0E0E0" opacity="0.7"/>
  <circle cx="1655" cy="125" r="2" fill="#E0E0E0" opacity="0.7"/>
  <circle cx="1665" cy="115" r="2" fill="#E0E0E0" opacity="0.7"/>
  
  <!-- Efectos de polvo/humo -->
  <ellipse cx="400" cy="420" rx="30" ry="8" fill="#34495E" opacity="0.3"/>
  <ellipse cx="900" cy="450" rx="25" ry="6" fill="#34495E" opacity="0.3"/>
  <ellipse cx="1450" cy="440" rx="35" ry="10" fill="#34495E" opacity="0.3"/>
</svg>